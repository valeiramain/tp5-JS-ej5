<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Practica de conceptos del DOM">
    <meta name="keywords" content="js, DOM, BOM, temporizador">
    <meta name="author" content="Valentina Iramain">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./css/style.css">
    <title>TP5 - JS - Temporizador</title>
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg bg-secondary">
            <div class="container">
                <a class="navbar-brand text-light" href="#">Temporizador ⏲️ </a>
            </div>
        </nav>
    </header>
    <main>

        <form class="container">
            <!-- Inputs de hora, minuto y segundo -->
            <div class="d-flex justify-content-center gap-3 p-3 m-5  border border-secondary rounded shadow">
                <div class="d-flex flex-column align-items-center">
                    <input type="number" id="inputHoras"
                        class="form-control text-center bg-secondary text-light border-0 w-sm-75 fs-1" placeholder="00" min="0" max="24">
                    <label for="inputHoras" class="form-label mt-2 text-light">Horas</label>
                </div>

                <div class="d-flex flex-column align-items-center">
                    <input type="number" id="inputMinutos"
                        class="form-control text-center bg-secondary text-light border-0 w-sm-75 fs-1" placeholder="00" min="0"
                        max="59">
                    <label for="inputMinutos" class="form-label text-light mt-2">Minutos</label>
                </div>

                <div class="d-flex flex-column align-items-center">
                    <input type="number" id="inputSegundos"
                        class="form-control text-center bg-secondary text-light border-0 w-sm-75 fs-1" placeholder="00" min="0"
                        max="59">
                    <label for="inputSegundos" class="form-label text-light mt-2">Segundos</label>
                </div>
            </div>


            <!-- Botones -->
            <div class="d-flex justify-content-center gap-2">
                <button type="submit" class="btn colorBtnIniciar fs-4 flex-fill"><i class="bi bi-play-btn"></i> Iniciar</button>
                <button type="button" class="btn colorBtnPausar fs-4 flex-fill"><i class="bi bi-pause-btn"></i> Pausar</button>
                <button type="button" class="btn colorBtnReIniciar fs-4 flex-fill"><i class="bi bi-arrow-clockwise"></i> Reiniciar</button>
            </div>
        </form>

        <!-- Contador -->
        <section class="d-flex justify-content-center rounded shadow m-5 ">
            <h2 class="display-1 fw-bold my-3 text-light"></h2>
        </section>

    </main>
    <footer class="text-center py-3 bg-secondary text-light">
        <p>&copy; Todos los derechos reservados</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="./js/app.js"></script>
</body>

</html>
